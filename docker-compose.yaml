services:
  # The Docker Engine (Sandbox)
  dind:
    image: docker:dind
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
    networks:
      - code-net
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    networks:
      - code-net

  # FastAPI App
  web:
    build: .
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Override .env so web + worker use the compose `redis` service by default
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      dind:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - code-net

  # Celery worker: caps concurrent Docker runs via --concurrency (tune as needed)
  worker:
    build: .
    command:
      [
        "celery",
        "-A",
        "worker.celery_app",
        "worker",
        "-l",
        "info",
        "--concurrency",
        "4",
      ]
    env_file: .env
    environment:
      DOCKER_HOST: tcp://dind:2375
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      dind:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - code-net

networks:
  code-net: